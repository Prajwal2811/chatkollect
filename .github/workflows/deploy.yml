
name: Deploy ChatKollect

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test GitHub Actions
        run: |
          echo "GitHub Actions is working!"
          echo "Deploying commit: $GITHUB_SHA"

      - name: Check SSH Key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "Checking SSH key..."

          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is EMPTY"
            exit 1
          fi

          echo "First line:"
          echo "$SSH_KEY" | head -n 1

          echo "Last line:"
          echo "$SSH_KEY" | tail -n 1

          echo "SSH key secret is present."

      - name: Deploy to CloudPanel Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "Preparing SSH..."

          mkdir -p ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          echo "Connecting to server..."

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'

          set -e

          echo "Connected successfully!"

          cd /home/chatkollect/htdocs/chatkollect.com

          echo "Fetching latest code..."
          git fetch origin main

          echo "Resetting to latest main..."
          git reset --hard origin/main

          echo "Installing Composer dependencies..."
          /usr/bin/php8.3 $(which composer) install --no-dev --optimize-autoloader

          echo "Running migrations..."
          /usr/bin/php8.3 artisan migrate --force

          echo "Clearing Laravel cache..."
          /usr/bin/php8.3 artisan optimize:clear

          echo "Caching config..."
          /usr/bin/php8.3 artisan config:cache

          echo "Caching routes..."
          /usr/bin/php8.3 artisan route:cache

          echo "Caching views..."
          /usr/bin/php8.3 artisan view:cache

          echo "Deployment completed successfully!"

          EOF